[package]
name = "nop-round"
version = "0.1.0"
edition = "2021"

[lib]
name = "nop_round"
path = "src/lib.rs"

[[bin]]
name = "nop-round-sidecar"
path = "src/main.rs"

[dependencies]
rust_decimal = { version = "=1.32.0", features = ["maths"] }
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
