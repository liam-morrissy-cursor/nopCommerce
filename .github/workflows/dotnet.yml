# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore src
    - name: Build
      run: dotnet build --no-restore --configuration Release src
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal src

  js-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Presentation/Nop.Web
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: src/Presentation/Nop.Web/package-lock.json
    - name: Install npm dependencies
      run: npm ci
    - name: Test
      run: npm test
